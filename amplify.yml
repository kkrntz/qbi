version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
    build:
      commands:
        # Amplify only exposes console environment variables at build time.
        # Copy the ones the server reads at runtime into .env.production so
        # the deployed SSR functions see them too.
        - env | grep -E '^(STORAGE_BUCKET|STORAGE_PREFIX|STORAGE_REGION|AUTH_SECRET)=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
